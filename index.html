<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#6c50c9">
<meta name="description" content="Kids English — Adventure Island: play, learn, unlock keys and dress up your cat.">
<title>Kids English — Adventure Island</title>
<link rel="icon" type="image/png" href="assets/brand/abc-cat-logo.png">
<link rel="apple-touch-icon" href="assets/brand/abc-cat-logo.png">
<link rel="stylesheet" href="assets/css/app.css">
<link rel="stylesheet" href="assets/animation/ambient.css">
</head>
<body>
<main id="game" aria-label="Kids English Adventure Island">
  <div id="stage" class="stage">
    <div class="map-art" aria-hidden="true"></div>
    <!-- Decorative original-coordinate effects; no new map hit targets. -->
    <svg class="island-ambient" viewBox="0 0 1672 941" preserveAspectRatio="none" aria-hidden="true" focusable="false">
      <defs>
        <linearGradient id="water-glint" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#b7f4ff" stop-opacity=".20"/><stop offset=".3" stop-color="#eaffff" stop-opacity=".95"/><stop offset=".75" stop-color="#f4ffff" stop-opacity=".8"/><stop offset="1" stop-color="#8ce8ff" stop-opacity=".12"/></linearGradient>
        <radialGradient id="mist-glow"><stop stop-color="#eaffff" stop-opacity=".85"/><stop offset="1" stop-color="#d9ffff" stop-opacity="0"/></radialGradient>
        <clipPath id="fall-upper"><path d="M1148 163 Q1238 156 1326 163 L1329 260 Q1300 279 1201 275 L1194 243 L1184 223 L1159 218 Z"/></clipPath>
        <clipPath id="fall-lower"><path d="M1228 294 Q1300 289 1383 298 L1383 404 Q1331 434 1266 424 L1265 384 L1245 369 Z"/></clipPath>
        <radialGradient id="leaf-feather"><stop offset=".65" stop-color="white"/><stop offset="1" stop-color="white" stop-opacity="0"/></radialGradient>
        <mask id="leaf-mask-left" maskUnits="userSpaceOnUse" x="119" y="75" width="222" height="155"><ellipse cx="225" cy="151" rx="106" ry="76" fill="url(#leaf-feather)"/></mask>
        <mask id="leaf-mask-center" maskUnits="userSpaceOnUse" x="537" y="0" width="340" height="145"><ellipse cx="707" cy="73" rx="170" ry="72" fill="url(#leaf-feather)"/></mask>
        <mask id="leaf-mask-right" maskUnits="userSpaceOnUse" x="1300" y="110" width="115" height="95"><ellipse cx="1357" cy="157" rx="57" ry="47" fill="url(#leaf-feather)"/></mask>
      </defs>
      <g clip-path="url(#fall-upper)">
        <path class="fall-stream" d="M1158 156 Q1165 182 1168 233 T1171 280"/><path class="fall-stream" d="M1180 156 Q1190 197 1194 280"/><path class="fall-stream" d="M1204 158 Q1211 203 1215 282"/><path class="fall-stream" d="M1229 158 Q1238 204 1235 282"/><path class="fall-stream" d="M1254 158 Q1266 212 1261 282"/><path class="fall-stream" d="M1280 157 Q1288 207 1285 283"/><path class="fall-stream" d="M1308 159 Q1316 211 1310 280"/>
      </g>
      <g clip-path="url(#fall-lower)">
        <path class="fall-stream" d="M1247 291 Q1259 338 1263 432"/><path class="fall-stream" d="M1274 291 Q1286 342 1284 432"/><path class="fall-stream" d="M1300 291 Q1311 344 1310 435"/><path class="fall-stream" d="M1326 293 Q1339 346 1335 434"/><path class="fall-stream" d="M1356 294 Q1366 348 1360 426"/>
      </g>
      <ellipse class="fall-mist" cx="1273" cy="277" rx="64" ry="10"/><ellipse class="fall-mist" cx="1329" cy="424" rx="73" ry="13"/>
      <g>
        <path class="shore-wave" d="M192 787 Q266 833 364 863 Q463 891 564 887 Q671 913 793 894 Q896 909 1008 871 Q1110 873 1192 826"/>
        <path class="shore-wave" d="M175 795 Q270 854 367 874 Q470 907 565 901 Q673 925 796 908 Q901 923 1013 885 Q1110 889 1206 838"/>
        <path class="shore-wave" d="M1235 762 Q1336 813 1447 785 Q1560 803 1635 753"/>
        <path class="shore-wave" d="M1256 774 Q1336 826 1453 799 Q1570 815 1645 767"/>
        <path class="shore-wave" d="M1248 595 Q1281 581 1301 553 Q1319 535 1304 511"/>
        <path class="shore-wave" d="M1381 427 Q1455 428 1534 391"/>
      </g>
      <g mask="url(#leaf-mask-left)"><image class="foliage-sway palm-left" href="assets/maps/g5-adventure-island.webp" width="1672" height="941" preserveAspectRatio="none"/></g>
      <g mask="url(#leaf-mask-center)"><image class="foliage-sway tree-center" href="assets/maps/g5-adventure-island.webp" width="1672" height="941" preserveAspectRatio="none"/></g>
      <g mask="url(#leaf-mask-right)"><image class="foliage-sway palm-right" href="assets/maps/g5-adventure-island.webp" width="1672" height="941" preserveAspectRatio="none"/></g>
    </svg>
    <svg class="route-lines" viewBox="0 0 1672 941" preserveAspectRatio="none" aria-hidden="true">
      <!-- G3: rounded, terrain-aware route. No line enters stop 1.
           Grass curves link the 4 stops to each chest in serpentine order;
           only the three bounded bridge curves cross the plank artwork. -->
      <path id="route-top" class="land-route" data-route="grass-1" d="M 426 255 C 660 255 780 255 895 255 C 963 255 1027 292 1054 319"></path>
      <path id="route-bridge-a" class="bridge-route" data-route="bridge-a" d="M 1054 319 C 1082 344 1108 376 1132 413 C 1143 430 1150 445 1150 456"></path>
      <path id="route-mid" class="land-route" data-route="grass-2" d="M 1150 456 C 1149 474 1102 473 1040 472 C 830 472 620 472 425 472 C 369 472 332 510 300 543"></path>
      <path id="route-bridge-b" class="bridge-route" data-route="bridge-b" d="M 300 543 C 264 564 241 593 236 623 C 234 651 253 681 278 703"></path>
      <path id="route-landfall-b" class="land-route" data-route="landfall-b" d="M 278 703 C 330 721 418 709 477 709"></path>
      <path id="route-low" class="land-route" data-route="grass-3" d="M 477 709 C 640 709 801 709 978 709 C 1068 709 1142 747 1200 730"></path>
      <path id="route-bridge-c" class="bridge-route" data-route="bridge-c" d="M 1200 730 C 1240 727 1288 701 1322 668 C 1338 652 1348 647 1354 646"></path>
      <path id="route-islet" class="land-route" data-route="islet" d="M 1354 646 C 1397 639 1433 643 1474 654"></path>
    </svg>

    <header class="topbar">
      <div class="brand-block">
        <img class="brand-logo" src="assets/brand/abc-cat-logo.png" alt="ABC kitten logo">
        <div class="brand-text"><strong>Kids English</strong><span>Adventure Island</span></div>
      </div>
      <nav class="top-controls" aria-label="Game navigation">
        <button id="world-button" class="hud-button world" type="button">🌐 <span>World Map</span></button>
        <div class="hud-scores" aria-live="polite">
          <span class="stat-item"><img src="assets/symbols/key.webp" alt=""><b id="hud-keys">0/12</b></span>
          <span class="hud-rule"></span>
          <span class="stat-item"><img src="assets/symbols/coin.webp" alt=""><b id="hud-coins">0</b></span>
        </div>
        <button id="cat-button" class="hud-button cat-link" type="button">🐱 <span>My Cat</span></button>
        <button id="settings-button" class="hud-button settings" type="button" aria-label="Settings">⚙️</button>
      </nav>
    </header>

    <div class="stage-label label-top"><img class="stage-icon" src="assets/symbols/g7-compass.webp" alt=""><span>Getting Started</span></div>
    <div class="stage-label label-mid"><img class="stage-icon" src="assets/symbols/g7-rocket.webp" alt=""><span>Next Level</span></div>
    <div class="stage-label label-low"><img class="stage-icon" src="assets/symbols/g7-mountain.webp" alt=""><span>Final Challenge</span></div>

    <div id="island-nodes"></div>

    <button id="island-cat" class="island-cat" title="My Cat" aria-label="Open My Cat wardrobe">
      <span class="cat-avatar-canvas">
        <span id="island-outfit-behind" class="outfit-behind" aria-hidden="true"></span>
        <img class="cat-base" src="assets/mascot/cat-dressable.webp" alt="Kitten explorer">
        <span id="island-outfit" class="outfit-overlays" aria-hidden="true"></span>
      </span>
    </button>

    <div id="map-status" class="map-status" role="status" aria-live="polite"></div>
  </div>
</main>
<div id="modal-root" aria-live="polite"></div>
<script type="module" src="assets/js/app.js"></script>
</body>
</html>
