<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#6c50c9">
<meta name="description" content="Kids English — Adventure Island: play, learn, unlock keys and dress up your cat.">
<title>Kids English — Adventure Island</title>
<link rel="icon" type="image/png" href="assets/brand/abc-cat-logo.png">
<link rel="apple-touch-icon" href="assets/brand/abc-cat-logo.png">
<link rel="stylesheet" href="assets/css/app.css">
</head>
<body>
<main id="game" aria-label="Kids English Adventure Island">
  <div id="stage" class="stage">
    <div class="map-art" aria-hidden="true"></div>
    <svg class="route-lines" viewBox="0 0 1672 941" preserveAspectRatio="none" aria-hidden="true">
      <!-- One authored route per grass tier; bridge dotted segments follow planks. -->
      <!-- First lesson is the beginning: no inbound route. -->
      <path class="land-route" d="M 502 281 H 914"></path>
      <path class="bridge-route" d="M 1026 311 C 1062 339 1096 380 1135 424"></path>
      <path class="land-route" d="M 1078 503 H 568"></path>
      <path class="bridge-route" d="M 436 530 C 373 534 288 556 240 620 C 222 655 235 682 284 702"></path>
      <path class="land-route" d="M 585 724 H 1014"></path>
      <path class="bridge-route" d="M 1138 742 C 1191 739 1244 712 1293 688 L 1333 671"></path>
    </svg>

    <header class="topbar">
      <div class="brand-block">
        <img class="brand-logo" src="assets/brand/abc-cat-logo.png" alt="ABC kitten logo">
        <div class="brand-text"><strong>Kids English</strong><span>Adventure Island</span></div>
      </div>
      <nav class="top-controls" aria-label="Game navigation">
        <button id="world-button" class="hud-button world" type="button">🌐 <span>World Map</span></button>
        <div class="hud-scores" aria-live="polite">
          <span class="stat-item"><img src="assets/symbols/key.webp" alt=""><b id="hud-keys">0/12</b></span>
          <span class="hud-rule"></span>
          <span class="stat-item"><img src="assets/symbols/coin.webp" alt=""><b id="hud-coins">0</b></span>
        </div>
        <button id="cat-button" class="hud-button cat-link" type="button">🐱 <span>My Cat</span></button>
        <button id="settings-button" class="hud-button settings" type="button" aria-label="Settings">⚙️</button>
      </nav>
    </header>

    <div class="stage-label label-top">Getting Started</div>
    <div class="stage-label label-mid">Next Level</div>
    <div class="stage-label label-low">Final Challenge</div>

    <div id="island-nodes"></div>

    <button id="island-cat" class="island-cat" title="My Cat" aria-label="Open My Cat wardrobe">
      <img src="assets/mascot/cat-map.webp" alt="Kitten explorer">
      <span id="island-outfit" class="outfit-overlays"></span>
    </button>

    <div id="map-status" class="map-status" role="status" aria-live="polite"></div>
  </div>
</main>
<div id="modal-root" aria-live="polite"></div>
<script type="module" src="assets/js/app.js"></script>
</body>
</html>
