name: Kids English Production Browser QA

on:
  workflow_run:
    workflows: [Deploy Kids English Pages]
    types: [completed]

# A separate read-only acceptance check; it never publishes or modifies Pages.
permissions:
  contents: read

jobs:
  hosted-smoke:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-24.04
    container: mcr.microsoft.com/playwright:v1.56.1-noble
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Install Chromium browser test runtime
        run: |
          npm install --no-save playwright@1.56.1
          # Official container includes preinstalled Chromium/WebKit libraries.
      - name: Test existing lessons, hearts, rewards and classic on public Pages
        env:
          KIDS_TEST_URL: https://nikonovmike2737.github.io/kids-english/
        run: node tests/block-c-browser.smoke.mjs
      - name: Test World Map and My Cat D/E on public Pages
        env:
          KIDS_TEST_URL: https://nikonovmike2737.github.io/kids-english/
        run: |
          for attempt in 1 2 3; do
            if node tests/block-de-browser.smoke.mjs; then exit 0; fi
            echo "Public CDN may not have propagated yet; retry ${attempt}/3"
            sleep 15
          done
          exit 1

      - name: Test all 15 G2 3D transparent assets and dressed cat on public Pages
        env:
          KIDS_TEST_URL: https://nikonovmike2737.github.io/kids-english/
        run: |
          for attempt in 1 2 3; do
            if node tests/g2-art-browser.smoke.mjs; then exit 0; fi
            echo "Public CDN asset propagation may still be in progress; retry ${attempt}/3"
            sleep 15
          done
          exit 1

      - name: Check G2R + G3 production landscape on Chromium at 5 viewports
        env:
          KIDS_TEST_URL: https://nikonovmike2737.github.io/kids-english/
          KIDS_BROWSER: chromium
        run: |
          for attempt in 1 2 3; do
            if node tests/g3-visual-browser.smoke.mjs; then exit 0; fi
            echo "CDN image/JS rollout not complete; retry ${attempt}/3"
            sleep 15
          done
          exit 1

      - name: G4 public key celebration and replay Chromium
        env:
          KIDS_TEST_URL: https://nikonovmike2737.github.io/kids-english/
          KIDS_BROWSER: chromium
        run: node tests/g4-reward-browser.smoke.mjs

      - name: G5 public retry illustration Chromium
        env:
          KIDS_TEST_URL: https://nikonovmike2737.github.io/kids-english/
          KIDS_BROWSER: chromium
        run: node tests/g5-retry-browser.smoke.mjs

      - name: G7 ambient motion and static wardrobe chromium
        env:
          KIDS_TEST_URL: https://nikonovmike2737.github.io/kids-english/
          KIDS_BROWSER: chromium
        run: node tests/g6-motion-browser.smoke.mjs

  hosted-safari:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-24.04
    container: mcr.microsoft.com/playwright:v1.56.1-noble
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Install pinned Playwright API
        run: npm install --no-save playwright@1.56.1
      - name: Independent public Safari/WebKit G2R and G3 visual QA
        env:
          KIDS_TEST_URL: https://nikonovmike2737.github.io/kids-english/
          KIDS_BROWSER: webkit
        run: node tests/g3-visual-browser.smoke.mjs

      - name: G4 public key celebration and replay WebKit
        env:
          KIDS_TEST_URL: https://nikonovmike2737.github.io/kids-english/
          KIDS_BROWSER: webkit
        run: node tests/g4-reward-browser.smoke.mjs

      - name: G5 public retry illustration WebKit
        env:
          KIDS_TEST_URL: https://nikonovmike2737.github.io/kids-english/
          KIDS_BROWSER: webkit
        run: node tests/g5-retry-browser.smoke.mjs

      - name: G7 ambient motion and static wardrobe webkit
        env:
          KIDS_TEST_URL: https://nikonovmike2737.github.io/kids-english/
          KIDS_BROWSER: webkit
        run: node tests/g6-motion-browser.smoke.mjs
