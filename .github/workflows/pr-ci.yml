name: Kids English PR regression checks

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'index.html'
      - 'assets/**'
      - 'tests/**'
      - '.github/workflows/**'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    container: mcr.microsoft.com/playwright:v1.56.1-noble
    steps:
      - uses: actions/checkout@v4
      - name: Validate JavaScript syntax
        run: |
          node --check assets/js/app.js
          node --check assets/js/data.js
      - name: Run Block B/C/D/E/G1/G2 contract tests
        run: node --test tests/*.test.mjs

      - name: Install Playwright Chromium for real browser checks
        run: |
          npm install --no-save playwright@1.56.1 http-server@14.1.1
          # Official browser container already has Chromium + dependencies.
      - name: Start local static site
        run: |
          nohup npx http-server . -a 127.0.0.1 -p 8765 -c-1 >/tmp/kids-english-http.log 2>&1 &
          sleep 3
          curl --fail --silent --head http://127.0.0.1:8765/
      - name: Browser smoke against PR files
        env:
          KIDS_TEST_URL: http://127.0.0.1:8765/
        run: node tests/block-c-browser.smoke.mjs
      - name: Browser smoke D/E against PR files
        env:
          KIDS_TEST_URL: http://127.0.0.1:8765/
        run: node tests/block-de-browser.smoke.mjs
      - name: Browser G2 art and outfit QA against PR files
        env:
          KIDS_TEST_URL: http://127.0.0.1:8765/
        run: node tests/g2-art-browser.smoke.mjs
      - name: G2R/G3 Chromium desktop, 390px mobile and map geometry
        env:
          KIDS_TEST_URL: http://127.0.0.1:8765/
          KIDS_BROWSER: chromium
        run: node tests/g3-visual-browser.smoke.mjs
      - name: G4 key celebration Chromium, replay idempotence and responsive art
        env:
          KIDS_TEST_URL: http://127.0.0.1:8765/
          KIDS_BROWSER: chromium
        run: node tests/g4-reward-browser.smoke.mjs
      - name: G5 retry illustration Chromium
        env:
          KIDS_TEST_URL: http://127.0.0.1:8765/
          KIDS_BROWSER: chromium
        run: node tests/g5-retry-browser.smoke.mjs
      - name: Upload D/E visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: de-visual-qa
          path: artifacts/*.png
          if-no-files-found: ignore

  safari-webkit:
    # Official Playwright image already contains Linux WebKit and all native
    # dependencies, avoiding slow apt installs that blocked the normal PR job.
    runs-on: ubuntu-24.04
    container: mcr.microsoft.com/playwright:v1.56.1-noble
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Playwright and local static server
        run: npm install --no-save playwright@1.56.1 http-server@14.1.1
      - name: Serve PR source in WebKit container
        run: |
          nohup npx http-server . -a 127.0.0.1 -p 8765 -c-1 >/tmp/kids-webkit-http.log 2>&1 &
          sleep 3
          curl --fail --silent --head http://127.0.0.1:8765/
      - name: G2R and G3 Safari WebKit at 5 responsive sizes
        env:
          KIDS_TEST_URL: http://127.0.0.1:8765/
          KIDS_BROWSER: webkit
        run: node tests/g3-visual-browser.smoke.mjs
      - name: G4 reward celebration WebKit
        env:
          KIDS_TEST_URL: http://127.0.0.1:8765/
          KIDS_BROWSER: webkit
        run: node tests/g4-reward-browser.smoke.mjs
      - name: G5 retry illustration WebKit
        env:
          KIDS_TEST_URL: http://127.0.0.1:8765/
          KIDS_BROWSER: webkit
        run: node tests/g5-retry-browser.smoke.mjs
      - name: Upload Safari desktop and mobile screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: g3-safari-visual-qa
          path: |
            artifacts/g3-webkit-*.png
            artifacts/g4-webkit-*.png
            artifacts/g5-webkit-*.png
          if-no-files-found: ignore
