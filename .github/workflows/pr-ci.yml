name: Kids English PR regression checks

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'index.html'
      - 'assets/**'
      - 'tests/**'
      - '.github/workflows/**'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Validate JavaScript syntax
        run: |
          node --check assets/js/app.js
          node --check assets/js/data.js
      - name: Run Block B/C/D/E/G1/G2 contract tests
        run: node --test tests/*.test.mjs

      - name: Install Playwright Chromium for real browser checks
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Start local static site
        run: |
          nohup python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/kids-english-http.log 2>&1 &
          sleep 2
          curl --fail --silent --head http://127.0.0.1:8765/
      - name: Browser smoke against PR files
        env:
          KIDS_TEST_URL: http://127.0.0.1:8765/
        run: node tests/block-c-browser.smoke.mjs
      - name: Browser smoke D/E against PR files
        env:
          KIDS_TEST_URL: http://127.0.0.1:8765/
        run: node tests/block-de-browser.smoke.mjs
      - name: Browser G2 art and outfit QA against PR files
        env:
          KIDS_TEST_URL: http://127.0.0.1:8765/
        run: node tests/g2-art-browser.smoke.mjs
      - name: Upload D/E visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: de-visual-qa
          path: artifacts/*.png
          if-no-files-found: ignore
      - name: Browser smoke D/E against published Production
        if: github.event_name == 'workflow_dispatch'
        env:
          KIDS_TEST_URL: https://nikonovmike2737.github.io/kids-english/
        run: node tests/block-de-browser.smoke.mjs
      - name: Browser smoke against current Production
        env:
          KIDS_TEST_URL: https://nikonovmike2737.github.io/kids-english/
        run: node tests/block-c-browser.smoke.mjs
