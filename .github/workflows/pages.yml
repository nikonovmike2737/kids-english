name: Deploy Kids English Pages

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'assets/**'
      - 'classic/**'
      - 'site/**'
      - 'content/**'
      - 'tests/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

# One workflow, one deployment job. Documentation-only changes do not redeploy.
permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Verify site entry point
        run: test -s index.html

      - name: Validate game sources and asset binaries
        shell: bash
        run: |
          set -euo pipefail
          node --check assets/js/app.js
          node --check assets/js/data.js
          node --test tests/*.test.mjs
          test -s classic/index.html
          python3 - <<'PY'
          from pathlib import Path
          expected=[
            'assets/maps/adventure-island.webp',
            'assets/mascot/cat-explorer.png',
            'assets/brand/abc-cat-logo.png',
            'assets/chests/closed.webp',
            'assets/chests/opened.webp',
            'assets/chests/grand.webp',
            'assets/symbols/key.webp',
            'assets/symbols/coin.webp',
            'assets/modals/sad-cat.webp',
            'assets/inventory/hats/tier-1.webp',
          ]
          for name in expected:
              p=Path(name)
              assert p.exists() and p.stat().st_size>100, name
              b=p.read_bytes()
              if p.suffix=='.webp':assert b[:4]==b'RIFF' and b[8:12]==b'WEBP',name
              if p.suffix=='.png':assert b[:8]==bytes([137,80,78,71,13,10,26,10]),name
          print('Game source and binary asset checks PASS')
          PY

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: '.'

      # GitHub's artifact API may lag behind a completed upload.
      # Verify that exactly one artifact is queryable before deploying.
      - name: Wait for uploaded artifact visibility
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..15}; do
            count="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts?per_page=100" --jq '[.artifacts[] | select(.name == "github-pages" and .expired == false)] | length')"
            if [ "$count" = "1" ]; then
              echo "Exactly one github-pages artifact is visible in run ${GITHUB_RUN_ID}"
              sleep 5
              exit 0
            fi
            if [ "$count" != "0" ]; then
              echo "::error::Expected one github-pages artifact, found ${count}"
              exit 1
            fi
            echo "Artifact not visible yet (${attempt}/15)"
            sleep 3
          done
          echo "::error::Timed out waiting for github-pages artifact"
          exit 1

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
